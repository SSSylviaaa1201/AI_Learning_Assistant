services:
  backend:
    image: ${AILA_IMAGE:-crpi-nhsrlij77120ulh1.cn-guangzhou.personal.cr.aliyuncs.com/sunyinluo/sunyinluo:assignment-20261021-report-ready}
    restart: unless-stopped
    ports:
      - "${AILA_BIND_ADDRESS:-127.0.0.1}:${AILA_BACKEND_PORT:-14242}:14242"
    environment:
      APP_SQLITE_PATH: /app/data/app.sqlite
      WORKSPACE_ROOT: /app/workspace
      MODEL_PROVIDER: openai_compatible
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://maas.qianwenaiapi.com/compatible-mode/v1}
      MODEL_NAME: ${MODEL_NAME:-qwen3.6-flash}
      MODEL_CONTEXT_WINDOW: ${MODEL_CONTEXT_WINDOW:-1000000}
      MODEL_SUPPORTS_STREAMING: "true"
      MODEL_SECRET_FILE: /app/data/model-secrets.env
      MODEL_KEY_ENCRYPTION_FILE: /app/data/model-key-encryption.key
    volumes:
      - ./data:/app/data
      - ./workspace:/app/workspace
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:14242/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
